name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Renomeia o APK
        run: mv build/app/outputs/flutter-apk/app-release.apk siga-keep-alive-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: siga-keep-alive-${{ github.ref_name }}.apk
          generate_release_notes: true
